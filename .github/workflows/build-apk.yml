name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler errors and Gradle's failure summary as annotations.
          grep -E '^e: |error:|ERROR:' build.log | head -15 | while IFS= read -r line; do
            echo "::error title=Build error::${line}"
          done
          summary=$(sed -n '/What went wrong:/,/Try:/p' build.log | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
          [ -n "$summary" ] && echo "::error title=Gradle failure::${summary}"
          exit 1

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MealLens.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MealLens-apk
          path: MealLens.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" MealLens.apk \
            --title "Meal Lens build ${{ github.run_number }}" \
            --notes "On your Android phone: tap MealLens.apk below, then open the download to install." \
            --latest
